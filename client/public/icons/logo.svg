<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bloomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E8B" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle Glow -->
  <circle cx="256" cy="256" r="230" fill="#162238" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#bloomGrad)" stroke-width="6" opacity="0.4" stroke-dasharray="12 8" />

  <!-- Blooming Petals (Growth & Healing) -->
  <g transform="translate(256, 256)">
    <!-- Top-Left Petal -->
    <path d="M 0 0 C -70 -70 -130 -40 -120 40 C -110 90 -40 70 0 0 Z" fill="url(#petalGrad1)" opacity="0.9" />
    <!-- Top-Right Petal -->
    <path d="M 0 0 C 70 -70 130 -40 120 40 C 110 90 40 70 0 0 Z" fill="url(#petalGrad2)" opacity="0.9" />
    <!-- Bottom Petal -->
    <path d="M 0 0 C -50 80 -10 140 0 140 C 10 140 50 80 0 0 Z" fill="url(#coralGrad)" opacity="0.85" />
  </g>

  <!-- Central Capsule / Pill Symbol -->
  <g transform="translate(256, 256) rotate(-35)">
    <!-- Capsule Left Half -->
    <path d="M -65 -32 L -15 -32 L -15 32 L -65 32 C -82 32 -96 18 -96 0 C -96 -18 -82 -32 -65 -32 Z" fill="#10B981" />
    <!-- Capsule Right Half -->
    <path d="M 15 -32 L 65 -32 C 82 -32 96 -18 96 0 C 96 18 82 32 65 32 L 15 32 Z" fill="#6366F1" />
    <!-- Capsule Center Divider & Cross -->
    <line x1="0" y1="-32" x2="0" y2="32" stroke="#FFFFFF" stroke-width="4" opacity="0.5" />
  </g>

  <!-- Central Clock Hands (Time & Consistency) -->
  <circle cx="256" cy="256" r="22" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="256" cy="256" r="8" fill="#162238" />
  <!-- Hour Hand pointing to 8:00 AM -->
  <line x1="256" y1="256" x2="200" y2="290" stroke="#162238" stroke-width="6" stroke-linecap="round" />
  <!-- Minute Hand pointing to 12:00 -->
  <line x1="256" y1="256" x2="256" y2="185" stroke="#10B981" stroke-width="5" stroke-linecap="round" />
</svg>
